server {
    listen 80;
    client_max_body_size 50M;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Uploaded Images
    location /uploads/ {
        proxy_pass http://backend:3001;
    }

    # Proxy Close Enough Game Data
    location /close-enough-data/ {
        proxy_pass http://backend:3001;
    }

    # Proxy Music Quiz Data
    location /music-quiz-data/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Proxy Static Game Images
    location /images/ {
        proxy_pass http://backend:3001;
    }

    # Proxy Socket.io requests to the backend
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Optimization for WebSockets and Long Polling
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
