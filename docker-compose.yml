version: '3.8'

services:
  backend:
    build: ./server
    container_name: gamehub-backend
    restart: unless-stopped
    volumes:
      # Persist the SQLite database file in a data directory
      - ./server_data:/app/data
      - ./server/data/close_enough:/app/game-content
    environment:
      - PORT=3001
      - JWT_SECRET=ProductionSecretKeyChangeThisToSomethingSecure
      - CLOSE_ENOUGH_DATA_PATH=/app/game-content
    networks:
      - gamehub-network

  frontend:
    build: ./client
    container_name: gamehub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gamehub-network

networks:
  gamehub-network:
    driver: bridge
